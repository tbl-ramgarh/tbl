<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<title>TBL लॉटरी</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{--deep:#0B3D2E;--green:#0F5A41;--gold:#D4AF37;--gold2:#E7CF8E;--bg:#F4F7F3;--ink:#10261c;--muted:#566a60;--line:#d3e0d8;--err:#a3231b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Mukta,"Noto Sans Devanagari",system-ui,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:460px;margin:0 auto;padding:0 16px 40px}
/* splash: ऐप खुलते समय एक बार चलने वाला एनिमेशन */
#splash{position:fixed;inset:0;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9;transition:opacity .6s,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
.ring{width:132px;height:132px;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:352;stroke-dashoffset:352;animation:draw 1.1s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.logo{position:absolute;inset:12px;border-radius:50%;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;color:var(--deep);animation:pop .7s .35s cubic-bezier(.2,1.4,.4,1) both}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#splash h1{color:var(--gold2);font-size:22px;margin:0;font-weight:800;animation:up .6s .8s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* header */
.hero{background:var(--deep);color:#fff;margin:0 -16px 20px;padding:24px 20px 28px;border-radius:0 0 30px 30px;display:flex;align-items:center;gap:14px;position:relative}
.hero:after{content:"";position:absolute;left:20px;right:20px;bottom:-1px;height:3px;background:var(--gold);border-radius:3px;transform-origin:left;animation:grow .9s .2s both}
@keyframes grow{from{transform:scaleX(0)}}
.hero .logo{position:relative;inset:auto;width:56px;height:56px;flex:none;font-size:17px;border:2px solid var(--gold);animation:none}
.hero h1{margin:0;font-size:21px;font-weight:800;line-height:1.2}
.hero p{margin:0;color:var(--gold2);font-size:14px}
/* screens और कार्ड */
.screen{animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.stg>*{animation:in .5s both}.stg>*:nth-child(2){animation-delay:.08s}.stg>*:nth-child(3){animation-delay:.16s}.stg>*:nth-child(4){animation-delay:.24s}.stg>*:nth-child(5){animation-delay:.32s}
.card{background:#fff;border-radius:22px;padding:20px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(11,61,46,.08)}
.card.gold{background:#fbf5df;border-color:var(--gold2)}
h2{font-size:20px;margin:0 0 4px;font-weight:800}
.sub{color:var(--muted);margin:0 0 6px;font-size:15px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 5px}
input,textarea,select{width:100%;padding:13px 14px;font:inherit;color:var(--ink);background:#fbfdfb;border:1.5px solid var(--line);border-radius:12px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.28)}
input[readonly],textarea[readonly]{background:#eef3ef;color:var(--muted)}
textarea{resize:none;min-height:72px}
.otp{letter-spacing:.5em;text-align:center;font-size:1.4rem;font-weight:800}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;width:100%;margin-top:18px;background:var(--green);color:#fff;position:relative;overflow:hidden;transition:transform .15s}
button:active{transform:scale(.97)}
button.gold{background:var(--gold);color:#2a1f00}
button.gold:before{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:rgba(255,255,255,.55);transform:skewX(-20deg);animation:shine 3.4s 1.2s infinite}
@keyframes shine{to{left:120%}}
button.ghost{background:transparent;color:var(--green);border:1.5px solid var(--line);margin-top:10px}
button:disabled{opacity:.6;cursor:default}
button.link{background:none;color:var(--green);padding:0;margin:0;width:auto;text-decoration:underline;font-size:15px}
button[hidden],div[hidden]{display:none}
.msg{margin-top:14px;padding:10px 12px;border-radius:12px;font-size:15px;display:none}
.msg.err{display:block;background:#fbe9e7;color:var(--err);animation:shake .4s}
.msg.ok{display:block;background:#e3f1e9;color:var(--green)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.kv span{color:var(--muted)}.kv b{font-weight:600;text-align:right;word-break:break-word}
.kv:first-of-type{border-top:0}
.stg>.card{margin-bottom:14px}
.hc.card{padding:0;overflow:hidden;margin-bottom:16px;animation:in .5s both}
.ph{height:150px;background:#c9ddd1;color:#1c4a35;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gf{position:absolute;left:12px;top:12px;background:var(--gold);color:#2a1f00;border-radius:16px;padding:5px 12px;font-size:14px;font-weight:600}
.hb{padding:16px}.hb h3{margin:0;font-size:20px;font-weight:800}
.big{display:flex;align-items:baseline;gap:8px;margin-top:12px}.big b{font-size:34px;font-weight:800;color:var(--green);line-height:1}.big span{font-size:14px;color:var(--muted)}
.pt{position:relative;height:12px;background:#dce8e1;border-radius:6px;margin-top:8px;overflow:hidden}
.pf{height:12px;background:var(--green);animation:fill 1s .2s both}@keyframes fill{from{width:0}}
.pt:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 2px),#fff calc(10% - 2px),#fff 10%)}
.chip{display:inline-block;background:#e3f1e9;color:var(--deep);border-radius:16px;padding:5px 12px;font-size:14px;margin:8px 6px 0 0}
button.chip{width:auto;margin:0 6px 6px 0;padding:6px 12px;border-radius:16px}
.two{display:flex;gap:10px;align-items:flex-end}.two>div{flex:1}.two input{flex:1}.two button.add{width:96px;margin:0;padding:13px 8px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.th{position:relative;display:inline-block;margin:0 8px 8px 0}.th img{width:84px;height:84px;object-fit:cover;border-radius:12px;display:block}
button.x{width:auto;margin:0;background:none;color:var(--muted);padding:4px 8px;border-radius:8px}
.th button.x{position:absolute;top:-6px;right:-6px;background:#fff;border:1px solid var(--line);border-radius:50%;width:26px;height:26px;padding:0;font-size:12px}
.tr{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;font-size:15px}
button.chip.on{background:var(--deep);color:#fff}
.ck{display:flex;gap:10px;align-items:center;font-weight:400;font-size:16px;margin:6px 0 0}.ck input{width:22px;height:22px;padding:0}
.qr{width:100%;max-width:240px;border-radius:12px;display:block}
.bank{background:#eef3ef;border-radius:12px;padding:10px 14px;white-space:pre-wrap;font-size:15px}
.shot{width:100%;border-radius:12px;margin-top:12px;display:block;max-height:320px;object-fit:cover}
.acts{display:flex;gap:10px}.acts button{flex:1}
.stc{display:inline-block;border-radius:10px;padding:2px 10px;font-size:13px;font-weight:600}
.stc.pending{background:#fbf5df;color:#6b4b00}.stc.confirmed{background:#e3f1e9;color:var(--green)}.stc.rejected{background:#fbe9e7;color:var(--err)}
.bdg{display:inline-block;background:var(--gold);color:#2a1f00;border-radius:12px;min-width:22px;padding:0 7px;margin-left:8px;font-size:14px;animation:pop .5s}.bdg[hidden]{display:none}
.p{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.p:first-child{border-top:0}
.av{width:42px;height:42px;border-radius:50%;background:#e3f1e9;color:var(--green);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.p b{letter-spacing:1px}.p .stc{margin-left:auto}
.win{margin-top:12px;background:#fbf5df;border-radius:12px;padding:10px 12px;font-size:15px}.win b{display:block}.win span{color:var(--muted);font-size:13px}
.rl{margin-top:14px;background:var(--deep);color:#fff;border-radius:18px;padding:18px;text-align:center}.rl small{display:block;color:var(--gold2)}
.rl b{display:block;font-size:32px;letter-spacing:3px;color:var(--gold);margin:6px 0}.rl span{color:var(--gold2);font-size:14px}
.rl p{margin:12px 0 0;font-size:14px;border-top:1px solid #1f5b46;padding-top:10px}.rl.won{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
.dng{color:var(--err);border-color:#e8c4c0}
.sk{height:230px;border-radius:22px;margin-bottom:16px;background:linear-gradient(90deg,#e6eee9 25%,#f4f8f5 50%,#e6eee9 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.urg{display:inline-block;background:#fbe9e7;color:var(--err);border-radius:12px;padding:3px 10px;font-size:13px;font-weight:600;margin:10px 6px 0 0;animation:pulse 1.6s infinite}@keyframes pulse{50%{transform:scale(1.06)}}
.urg2{display:inline-block;background:#fbf5df;color:#6b4b00;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:600;margin-top:10px}
.gal{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.gal img{position:static;flex:none;width:100%;height:100%;scroll-snap-align:center}
a.btn2{display:flex;align-items:center;justify-content:center;flex:1;min-height:46px;border:1.5px solid var(--line);border-radius:14px;color:var(--green);font-weight:600;text-decoration:none;background:#fff}
.dup{margin-top:12px;background:#fbe9e7;color:var(--err);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;animation:in .5s both}
.tile b{display:block;font-size:26px;font-weight:800;color:var(--green)}.tile span{font-size:13px;color:var(--muted)}
.ticket{border:2px dashed var(--gold);border-radius:18px;padding:18px;background:#fffdf3;text-align:center}.ticket b.no{font-size:26px;letter-spacing:2px;color:var(--deep)}.ticket .kv{text-align:left}
.flash{animation:flash 1.6s 2}@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0)}30%{box-shadow:0 0 0 6px rgba(212,175,55,.55)}}
/* ===== नया डिज़ाइन: नेविगेशन, कार्ड, शीट, स्टेपर ===== */
h1,h2,h3,.hn{font-family:'Tiro Devanagari Hindi',Mukta,serif;font-weight:400}
h2{font-size:21px}small,.hint,.stc,.chip{font-size:14px}.kv{font-size:16px}
.top{display:flex;align-items:center;gap:12px;background:var(--deep);color:#fff;margin:0 -16px 16px;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 26px 26px;position:relative}
.top:after{content:"";position:absolute;left:20px;right:20px;bottom:-1px;height:3px;background:var(--gold);border-radius:3px;transform-origin:left;animation:grow .9s .2s both}
.top b{display:block;font-size:18px}.top small{color:var(--gold2)}
.logo.sm{position:relative;inset:auto;width:44px;height:44px;flex:none;font-size:14px;border:2px solid var(--gold);animation:none}
button.bk2{width:42px;height:42px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.how{display:flex;gap:8px;margin-bottom:18px}.how div{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 6px;font-size:14px;font-weight:600;text-align:center;line-height:1.25}
.how i{display:flex;width:26px;height:26px;margin:0 auto 6px;border-radius:50%;background:var(--gold);color:#2a1f00;font-style:normal;font-weight:800;align-items:center;justify-content:center}
.sec{margin:6px 2px 12px}
.hc{background:#fff;border-radius:24px;overflow:hidden;margin-bottom:18px;box-shadow:0 10px 28px rgba(11,61,46,.12);cursor:pointer;animation:in .5s both}
.hp{position:relative;height:220px;background:#c9ddd1;color:#1c4a35;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hp>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0,transparent 38%,rgba(5,30,22,.88) 100%);pointer-events:none}
.ttl{position:absolute;left:16px;right:16px;bottom:12px;color:#fff;pointer-events:none}.ttl h3{margin:0;font-size:24px;line-height:1.2;color:#fff}.ttl span{font-size:14px;color:var(--gold2)}
.rib{position:absolute;left:0;top:16px;background:linear-gradient(90deg,#E7CF8E,#D4AF37);color:#2a1500;padding:6px 16px 6px 14px;border-radius:0 14px 14px 0;box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;max-width:70%}
.rib small{display:block;font-size:12px;font-weight:600}.rib b{font-size:18px;line-height:1.1}
.hot{position:absolute;right:12px;top:16px;background:#c0392b;color:#fff;border-radius:14px;padding:4px 12px;font-size:13px;font-weight:600;animation:pulse 1.6s infinite;pointer-events:none}
.hb .acts button{margin-top:12px}
nav#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--deep);border-radius:22px 22px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
#nav[hidden]{display:none}
#nav button{flex:1;margin:0;background:transparent;color:#a9cdb9;padding:8px 2px;border-radius:16px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button.on{background:#1f6b4f;color:#fff}
#nav .nb{position:absolute;top:2px;right:16%;background:var(--gold);color:#2a1f00;border-radius:10px;min-width:18px;font-size:11px;font-style:normal;font-weight:800;padding:0 5px}
.hasnav .wrap{padding-bottom:100px}
.cta{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;z-index:5}
.cta button{margin:0;flex:1}.cta b{font-size:22px;color:var(--green)}.cta small{display:block;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(5,30,22,.55);display:flex;align-items:flex-end;z-index:30;animation:fade .2s}.ov.out{opacity:0;transition:opacity .2s}
.sh{background:#fff;width:100%;max-width:460px;margin:0 auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up2 .25s}
.sh h3{margin:0 0 6px;font-size:22px}.sh .acts{margin-top:14px}.sh button{margin:0}.sh input{margin-top:10px}
button.dg{background:var(--err);color:#fff}
@keyframes fade{from{opacity:0}}@keyframes up2{from{transform:translateY(100%)}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));max-width:428px;margin:0 auto;padding:12px 16px;border-radius:14px;color:#fff;font-weight:600;z-index:40;animation:in .3s;transition:opacity .4s}
.toast.err{background:var(--err)}.toast.ok{background:var(--green)}.toast.out{opacity:0}
.stp{display:flex;margin:4px 0 16px}.stp div{flex:1;text-align:center;font-size:14px;color:var(--muted);position:relative}
.stp i{display:flex;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;background:#dce8e1;color:var(--muted);font-style:normal;font-weight:800;align-items:center;justify-content:center;position:relative;z-index:1;transition:.3s}
.stp .on i{background:var(--gold);color:#2a1f00;transform:scale(1.1)}.stp .dn i{background:var(--green);color:#fff}
.stp div+div:before{content:"";position:absolute;left:-50%;right:50%;top:14px;height:3px;background:#dce8e1}.stp .on:before,.stp .dn:before{background:var(--green)}
a.lnk{display:block;text-align:center;padding:14px;border-radius:14px;background:var(--gold);color:#2a1f00;font-weight:600;text-decoration:none;margin-top:14px}
.drop{border:2px dashed #9fc4b0;border-radius:18px;min-height:150px;display:flex;align-items:center;justify-content:center;color:var(--green);font-weight:600;margin-top:12px;overflow:hidden;cursor:pointer}.drop img{width:100%;max-height:340px;object-fit:contain}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.fi{background:#eef5f0;border-radius:14px;padding:12px 6px;text-align:center;font-size:14px;color:var(--deep);display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.2}
.gl{position:relative;height:280px;margin:0 -16px;background:#c9ddd1;overflow:hidden;color:#1c4a35;display:flex;align-items:center;justify-content:center}
.gl .gal{position:absolute;inset:0}.gl>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gl button.bk2{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:2;background:rgba(0,0,0,.45)}
.cnt{position:absolute;right:12px;bottom:36px;background:rgba(0,0,0,.55);color:#fff;border-radius:12px;padding:2px 10px;font-size:13px}
.dt{margin:-24px -16px 0;position:relative;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 16px 110px}
.dt h1{margin:0;font-size:28px;line-height:1.2}
.rib2{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,#fbf0c8,#f4dd8a);border:1px solid var(--gold);border-radius:18px;padding:12px 14px;margin:14px 0;color:#2a1500}
.rib2 small{display:block;font-size:14px}.rib2 b{font-size:20px}
.inst{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--gold);border-radius:18px;padding:10px 12px;margin-bottom:16px}
.inst b{display:block}.inst small{color:var(--muted);line-height:1.25;display:block}.inst button{margin:0;width:auto;padding:8px 14px}
.okc circle{stroke-dasharray:176;stroke-dashoffset:176;animation:draw .7s .1s forwards}.okc path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .6s forwards}
.wr{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}.wr .card{min-width:230px}
button.sm{width:auto;margin:0;padding:8px 16px}
.shotv{background:rgba(0,0,0,.92);align-items:center;justify-content:center}
.shotv .sc{overflow:auto;max-width:100%;max-height:100%;touch-action:pan-x pan-y pinch-zoom}.shotv img{max-width:100%;display:block;margin:auto}
.shotv button.x{position:fixed;top:14px;right:14px;background:#fff;color:#000;border-radius:50%;width:44px;height:44px;padding:0;z-index:2;font-size:18px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}button.gold:before{animation:none}}
</style>
</head>

<script>
window.__fatal = function (m) {
  if (window.__shown) return; window.__shown = true;
  var s = document.getElementById('splash'); if (s) s.style.display = 'none';
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#fff;border:2px solid #b3261e;border-radius:14px;padding:14px;font:15px/1.5 sans-serif;color:#10261c;word-break:break-word';
  d.textContent = 'ऐप शुरू नहीं हो पाई (संस्करण 2026-11-16-e)। यह संदेश स्क्रीनशॉट में भेजो: ' + m;
  document.body.appendChild(d);
};
window.addEventListener('error', function (e) { window.__fatal((e.message || 'error') + ' (लाइन ' + e.lineno + ')'); });
window.addEventListener('unhandledrejection', function (e) { window.__fatal(String(e.reason && (e.reason.message || e.reason))); });
setTimeout(function () { if (!window.__ok) window.__fatal('बहुत देर तक लोड नहीं हुआ'); }, 15000);
</script>

}

function viewSignup() {

const MON = ['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
const fd = d => { const [y, m, x] = String(d).split('-'); return x && m ? `${+x} ${MON[+m - 1]}` : ''; };
function compress(file, max = 900, q = .75) {
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', q)); };
    im.onerror = () => rej(new Error('img')); im.src = u;
  });
}

function dhash(src) {

      const d = g.getImageData(0, 0, 9, 8).data, L = i => d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11; let bits = '';

  };

    const ed = e.target.closest('[data-edit]'); if (ed) return viewNewHostel(HL.find(h => h.id === ed.dataset.edit));

  };
  let c = null; try { c = JSON.parse(LS.getItem('c_hostels') || 'null'); } catch (x) {}
  if (c && c.ok && c.email === me.email) { LH = JSON.stringify(c); draw(c); } else { LH = ''; el.innerHTML = '<div class="sk"></div><div class="sk"></div>'; }
  const go = async () => {
    const r = await api('hostels'); if (!el.isConnected) return;
    if (r.ok) { r.email = me.email; try { LS.setItem('c_hostels', JSON.stringify(r)); LS.setItem('c_hostels_t', String(Date.now())); } catch (x) {} }
    const j = JSON.stringify(r); if (j === LH) return; LH = j; draw(r);
  };
  if (!(c && c.ok && c.email === me.email && Date.now() - Number(LS.getItem('c_hostels_t') || 0) < 8000)) go();
  HT = setInterval(go, 30000);
}

/* ---------- बुकिंग: 3 कदम ---------- */
async function viewBook(id) {
  show(`<div class="top"><button class="bk2" id="bk" aria-label="वापस">${ico(IC.back)}</button><div><b>सीट बुक करो</b><small id="bs">लोड हो रहा है...</small></div></div><div id="st"></div><div id="bd"></div>`);
  $('bk').onclick = () => viewHostel(id);
  const r = await api('bookingInfo', { hostelId: id });
  if (!r.ok) { if (r.error === 'SESSION') return sessOut(); toast(r.error); return viewHome(); }
  const h = r.hostel; let step = 1, shot = '', ph = '', agree = false;
  $('bs').textContent = h.name;
  const upiUrl = h.upi ? `upi:${SL}pay?pa=${encodeURIComponent(h.upi)}&pn=${encodeURIComponent(S.app_name)}&am=${h.fee}&cu=INR&tn=${encodeURIComponent('Hostel booking')}` : '';
  const done = () => {
    LS.removeItem('c_hostels');
    show(`${topbar('बुकिंग भेज दी गई', 'जाँच के बाद सीट पक्की होगी')}<div class="card stg" style="text-align:center"><svg class="okc" width="96" height="96" viewBox="0 0 64 64" fill="none" stroke="#0F5A41" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="32" cy="32" r="28"/><path d="M20 33l8 8 17-18"/></svg>
      <h2>धन्यवाद, ${esc(me.name.split(' ')[0])}</h2><p class="sub">आपका स्क्रीनशॉट एडमिन को मिल गया है। तब तक सीट आपके लिए रुकी रहेगी।</p>
      <button class="gold" id="mb2">मेरी बुकिंग देखो</button><button class="ghost" id="hm">लॉटरी पर जाओ</button></div>`);
    $('mb2').onclick = viewMine; $('hm').onclick = viewHome; confetti();
  };
  const draw = () => {
    $('st').innerHTML = `<div class="stp">${['भुगतान', 'स्क्रीनशॉट', 'पुष्टि'].map((t, i) => `<div class="${step > i + 1 ? 'dn' : step === i + 1 ? 'on' : ''}"><i>${step > i + 1 ? '✓' : i + 1}</i>${t}</div>`).join('')}</div>`;
    let body, foot;
    if (step === 1) {
      body = `<div class="card"><div class="big"><b>₹${h.fee}</b><span>सिर्फ बुकिंग फीस</span></div><p class="hint">लॉटरी की बाकी फीस मालिक (${esc(h.ownerName)}, ${esc(h.ownerMobile)}) से तय होगी।</p>
        ${upiUrl ? `<a class="lnk" href="${esc(upiUrl)}">UPI ऐप से भुगतान करो</a><p class="hint" style="text-align:center">भुगतान के बाद इसी ऐप में वापस आकर स्क्रीनशॉट डालो।</p>` : ''}
        ${h.upi ? `<label for="up">UPI ID</label><div class="two"><input id="up" value="${esc(h.upi)}" readonly><button class="add ghost" id="cp">कॉपी</button></div>` : ''}
        ${h.qr ? `<label>QR कोड</label><img class="qr" src="${esc(h.qr)}" alt="QR कोड">` : ''}${h.bank ? `<label>बैंक डिटेल</label><div class="bank">${esc(h.bank)}</div>` : ''}</div>`;
      foot = '<button class="gold" id="nx">भुगतान कर दिया, आगे बढ़ो</button>';
    } else if (step === 2) {
      body = `<div class="card"><h2>भुगतान का स्क्रीनशॉट</h2><div class="drop" id="dp">${shot ? `<img src="${shot}" alt="">` : 'स्क्रीनशॉट चुनो'}</div><input id="sf" type="file" accept="image/jpeg,image/png,image/webp" hidden></div>`;
      foot = `<button class="ghost" id="pv">पीछे</button><button class="gold" id="nx" ${shot ? '' : 'disabled'}>आगे</button>`;
    } else {
      body = `<div class="card"><h2>पुष्टि करो</h2><div class="kv"><span>लॉटरी</span><b>${esc(h.name)}</b></div><div class="kv"><span>बुकिंग फीस</span><b>₹${h.fee}</b></div><div class="kv"><span>नाम</span><b>${esc(me.name)}</b></div><div class="kv"><span>मोबाइल</span><b>${esc(me.mobile || '')}</b></div></div>
        ${h.terms.length ? `<div class="card" style="margin-top:14px"><h2>नियम और शर्तें</h2>${h.terms.map((t, i) => `<div class="tr"><span>${i + 1}. ${esc(t)}</span></div>`).join('')}</div>` : ''}
        <label class="ck"><input type="checkbox" id="ag" ${agree ? 'checked' : ''}> मैंने शर्तें पढ़ ली हैं</label>`;
      foot = '<button class="ghost" id="pv">पीछे</button><button class="gold" id="nx">बुकिंग भेजो</button>';
    }
    $('bd').innerHTML = `<div class="screen">${body}</div><div style="height:96px"></div><div class="cta">${foot}</div>`;
    if ($('cp')) $('cp').onclick = () => { navigator.clipboard?.writeText(h.upi); toast('UPI ID कॉपी हो गया', 'ok'); };
    if ($('pv')) $('pv').onclick = () => { step--; draw(); };
    if ($('ag')) $('ag').onchange = e => { agree = e.target.checked; };
    if ($('dp')) { $('dp').onclick = () => $('sf').click(); $('sf').onchange = async e => { try { shot = await compress(e.target.files[0], 1000, .7); ph = await dhash(shot); } catch (x) { toast('फोटो नहीं खुली, दूसरी चुनो'); } draw(); }; }
    $('nx').onclick = () => {
      if (step < 3) { step++; return draw(); }
      if (!$('ag').checked) return toast('पहले शर्तों पर टिक करो');
      busy($('nx'), async () => { const x = await api('book', { hostelId: id, shot, ph }); if (!x.ok) { if (x.error === 'SESSION') return sessOut(); return toast(x.error); } done(); });
    };
  };
  draw();
}

(async function start() {
  const sp = $('splash'), t0 = Date.now();
  if (CONFIG.API_URL.startsWith('YAHAN')) {
    sp.classList.add('out');
    return show(hero('सेटअप बाकी है') + '<div class="card">index.html में CONFIG.API_URL की जगह Apps Script का Web App URL डालो।</div>');
  }
  const r = await api('init'); /* एक ही बार में सेटिंग + लॉगिन + लॉटरी */
  if (r.ok) {
    S = { ...S, ...r.settings }; SRV_V = r.v || '';
    if (r.user) {
      me = r.user;
      if (r.hostels && r.hostels.ok) { r.hostels.email = me.email; try { LS.setItem('c_hostels', JSON.stringify(r.hostels)); LS.setItem('c_hostels_t', String(Date.now())); } catch (e) {} }
    } else if (LS.getItem('tok')) LS.removeItem('tok');
  }
  if (S.logo) { const im = new Image(); im.alt = ''; im.onload = () => $('sl')?.appendChild(im); im.src = S.logo; }
  document.title = S.app_name;
  const seen = LS.getItem('seen'); LS.setItem('seen', '1');
  const wait = (seen ? 500 : 1500) - (Date.now() - t0); if (wait > 0) await new Promise(x => setTimeout(x, wait));
  me ? viewHome() : viewLogin(); sp.classList.add('out'); window.__ok = true;
})();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
